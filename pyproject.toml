[project]
name = "compsoft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "glfw>=2.10.1",
  "numpy>=2.5.1",
  "pillow>=12.3.0",
  "pyglm>=2.8.3",
  "pyopengl>=3.1.10",
  "rich>=15.0.0",
  "trimesh>=4.12.2",
]

[project.scripts]
compsoft = "compsoft.__main__:main"

[dependency-groups]
dev = [
  "isort>=8.0.1",
  "pre-commit>=4.6.0",
  "ruff>=0.15.17",
  "ty>=0.0.49",
]

[build-system]
requires = ["pdm-backend>=2.4.9"]
build-backend = "pdm.backend"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[tool.pdm.build]
includes = ["compsoft"]

[tool.uv]
link-mode = "copy"
default-groups = []

[tool.uv.workspace]
members = ["."]

[tool.uv.sources]
compsoft = { workspace = true }
